name: Release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api-health-monitor
    env:
      DEBUG: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: api_health_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d api_health_monitor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/api-health-monitor/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Check SQLite migrations
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: |
          alembic upgrade head
          alembic check
      - name: Check PostgreSQL migrations
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PASSWORD: ci-only
        run: |
          alembic upgrade head
          alembic check
      - name: Build and start the Compose stack
        env:
          POSTGRES_PASSWORD: ci-only
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 120
          curl --fail --retry 5 http://127.0.0.1:8000/ready
          curl --fail http://127.0.0.1:8000/login
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/endpoints)" = 401
      - name: Stop the CI stack
        if: always()
        env:
          POSTGRES_PASSWORD: ci-only
        run: |
          docker compose logs --no-color
          docker compose down --volumes
