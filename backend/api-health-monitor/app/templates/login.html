<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | API Health Monitor</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/login.js" defer></script>
</head>
<body>
  <main class="content">
    <form id="login-form" class="login-form" method="post">
      <h1>Sign in to API Health Monitor</h1>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" maxlength="64" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
      <p id="login-error" role="alert" hidden></p>
      <button class="button button-primary" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
