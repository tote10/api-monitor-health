services:
  - type: web
    name: api-health-monitor
    runtime: docker
    plan: free
    rootDir: backend/api-health-monitor
    dockerfilePath: backend/api-health-monitor/Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: AUTH_SECURE_COOKIE
        value: true
      - key: MONITORING_ENABLED
        value: true
      - key: DATABASE_URL
        value: sqlite:///./api_health_monitor.db

